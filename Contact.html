<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Kisaan - Contact Us</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            overflow-x: hidden;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 3rem 0;
            font-size: 2.8rem;
            font-weight: bold;
            animation: fadeInDown 1s ease;
        }

        .container {
            width: 90%;
            margin: 4rem auto;
        }

        .contact-info {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 4rem;
            animation: fadeInUp 1s ease-out;
        }

        .contact-info div {
            flex: 1;
            padding: 1.5rem;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .contact-info div:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .contact-info h3 {
            font-size: 2rem;
            color: #009ffd;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .contact-info .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .contact-info .info-item:hover {
            color: #6a11cb;
        }

        .contact-info .info-item i {
            font-size: 1.7rem;
            transition: all 0.3s ease;
        }

        .contact-info .info-item:hover i {
            transform: scale(1.3);
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 1s ease-out;
        }

        .form-container h3 {
            font-size: 2.5rem;
            color: #009ffd;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-container form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-container form input,
        .form-container form textarea {
            padding: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        .form-container form input:focus,
        .form-container form textarea:focus {
            border-color: #6a11cb;
        }

        .form-container form textarea {
            grid-column: span 2;
            height: 150px;
        }

        .form-container form button {
            padding: 1rem 2rem;
            background-color: #6a11cb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            grid-column: span 2;
        }

        .form-container form button:hover {
            background-color: #2575fc;
        }

        .map-container {
            margin-top: 4rem;
            display: flex;
            justify-content: center;
            animation: fadeInUp 1s ease-out;
        }

        .map-container iframe {
            border: none;
            width: 100%;
            height: 450px;
            border-radius: 12px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-info {
                flex-direction: column;
            }

            .form-container form {
                grid-template-columns: 1fr;
            }

            .form-container form button {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>
    <header>
        Mai Kisaan - Contact Us
    </header>

    <div class="container">
        <!-- Contact Information -->
        <div class="contact-info">
            <div>
                <h3>Contact Details</h3>
                <div class="info-item">
                    <i class="fas fa-phone-alt"></i>
                    <span>+91 123 456 7890</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>support@maikisaan.com</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Main Office, City, State</span>
                </div>
            </div>

            <div>
                <h3>Social Media</h3>
                <div class="info-item">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </div>
                <div class="info-item">
                    <i class="fab fa-twitter"></i>
                    <span>Twitter</span>
                </div>
                <div class="info-item">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </div>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="form-container">
            <h3>Get In Touch</h3>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

        <!-- Map -->
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387190.2799120205!2d-74.25987799884803!3d40.6976701!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a265bcd2c27%3A0x82f200f4e4096749!2sNew%20York%20City%2C%20NY!5e0!3m2!1sen!2sus!4v1635776351145!5m2!1sen!2sus"
                allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <!-- Font Awesome Icons (For social media and contact icons) -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</body>

</html>
