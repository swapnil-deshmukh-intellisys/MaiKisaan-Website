<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import-Export - Farmers' Products</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js CDN -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@300;400;600&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f6fa;
        }

        /* Header */
        header {
            background-color: #3F51B5;
            color: white;
            padding: 1.5rem;
            text-align: center;
            font-family: 'Open Sans', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            margin-top: 2rem;
            font-size: 2rem;
            color: #673AB7;
        }

        /* Main Section */
        .main-section {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            padding: 1rem;
        }

        /* Card Styling */
        .import-export-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 40%;
            text-align: center;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Hover Effect for Cards */
        .import-export-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        /* Heading */
        .import-export-card h3 {
            font-size: 1.8rem;
            color: #3F51B5;
            margin-bottom: 1rem;
        }

        /* Button Styling */
        .import-export-card button {
            background-color: #673AB7;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        .import-export-card button:hover {
            background-color: #512DA8;
        }

        /* Form Inputs */
        .import-export-card input, .import-export-card select {
            padding: 0.8rem;
            margin: 1rem 0;
            width: 80%;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .import-export-card input:focus, .import-export-card select:focus {
            border-color: #3F51B5;
            outline: none;
        }

        /* Keyframe Animation for Fade In */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* History Section */
        .history-section {
            margin-top: 3rem;
            text-align: center;
        }

        .history-section h3 {
            font-size: 2rem;
            color: #673AB7;
            margin-bottom: 2rem;
        }

        /* Chart Container */
        .chart-container {
            width: 80%;
            margin: 0 auto;
        }

        /* Table Section */
        .table-container {
            width: 90%;
            margin: 3rem auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: center;
            border: 1px solid #ccc;
        }

        th {
            background-color: #3F51B5;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f3f3f7;
        }

        /* Transitions on Quantity and Price */
        .quantity, .price {
            transition: transform 0.3s ease-in-out, color 0.3s ease;
        }

        .quantity:hover, .price:hover {
            transform: scale(1.1);
            color: #673AB7;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mai Kisaan - Import-Export</h1>
    </header>

    <div class="page-title">
        <h2>Manage Products for Import & Export</h2>
    </div>

    <div class="main-section">
        <!-- Import Card -->
        <div class="import-export-card">
            <h3>Import Products</h3>
            <form id="import-form">
                <input type="text" placeholder="Product Name" required>
                <input type="number" placeholder="Quantity" required>
                <input type="text" placeholder="Country of Origin" required>
                <select required>
                    <option value="">Select Category</option>
                    <option value="fruits">Fruits</option>
                    <option value="vegetables">Vegetables</option>
                    <option value="grains">Grains</option>
                    <option value="dairy">Dairy</option>
                </select>
                <button type="submit">Import Product</button>
            </form>
        </div>

        <!-- Export Card -->
        <div class="import-export-card">
            <h3>Export Products</h3>
            <form id="export-form">
                <input type="text" placeholder="Product Name" required>
                <input type="number" placeholder="Quantity" required>
                <input type="text" placeholder="Destination Country" required>
                <select required>
                    <option value="">Select Category</option>
                    <option value="fruits">Fruits</option>
                    <option value="vegetables">Vegetables</option>
                    <option value="grains">Grains</option>
                    <option value="dairy">Dairy</option>
                </select>
                <button type="submit">Export Product</button>
            </form>
        </div>
    </div>

    <!-- History Section -->
    <div class="history-section">
        <h3>Product Import-Export History</h3>
        <div class="chart-container">
            <h4>Fruits Import & Export (Daily)</h4>
            <canvas id="fruitsChart"></canvas>
            <h4>Vegetables Import & Export (Daily)</h4>
            <canvas id="vegetablesChart"></canvas>
            <h4>Grains Import & Export (Daily)</h4>
            <canvas id="grainsChart"></canvas>
            <h4>Dairy Import & Export (Daily)</h4>
            <canvas id="dairyChart"></canvas>
        </div>
    </div>

    <!-- Product History Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <!-- Data will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <script>
        // Keep the same JavaScript logic as in the original code
        // Update the charts and table dynamically
        const historyData = {
            fruits: { imports: [2, 3, 4, 5, 2, 4, 3], exports: [1, 2, 3, 4, 1, 3, 2] },
            vegetables: { imports: [3, 4, 2, 3, 5, 6, 4], exports: [2, 3, 4, 2, 3, 4, 3] },
            grains: { imports: [4, 5, 6, 4, 3, 6, 5], exports: [3, 4, 3, 5, 4, 3, 4] },
            dairy: { imports: [5, 4, 6, 5, 7, 6, 8], exports: [3, 4, 3, 5, 3, 4, 4] }
        };

        const labels = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'];

        function updateChart(chartId, data, labels) {
            const ctx = document.getElementById(chartId).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Imports', data: data.imports, borderColor: '#3F51B5', fill: false },
                        { label: 'Exports', data: data.exports, borderColor: '#673AB7', fill: false }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function updateTable(category) {
            const tableBody = document.getElementById('historyTableBody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${category.charAt(0).toUpperCase() + category.slice(1)}</td>
                <td>${category.charAt(0).toUpperCase() + category.slice(1)}</td>
                <td>${historyData[category].imports.reduce((a, b) => a + b, 0)}</td>
                <td>$${(historyData[category].imports.reduce((a, b) => a + b, 0) * 5).toFixed(2)}</td>
            `;
            tableBody.appendChild(newRow);
        }

        ['fruits', 'vegetables', 'grains', 'dairy'].forEach(category => {
            updateChart(`${category}Chart`, historyData[category], labels);
            updateTable(category);
        });
    </script>
</body>
</html>
